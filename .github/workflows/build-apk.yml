name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version: ${JAVA_RAW_VERSION}"
          if [ -z "${JAVA_RAW_VERSION}" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi

          JAVA_MAJOR=$(echo "${JAVA_RAW_VERSION}" | cut -d'.' -f1)
          if [ "${JAVA_MAJOR}" = "1" ]; then
            JAVA_MAJOR=$(echo "${JAVA_RAW_VERSION}" | cut -d'.' -f2)
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version from '${JAVA_RAW_VERSION}'."
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java version (${JAVA_MAJOR}) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully (Java ${JAVA_MAJOR} >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent signing keystore
        env:
          VIPER_KEYSTORE_BASE64: ${{ secrets.VIPER_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          VIPER_STORE_PASSWORD: ${{ secrets.VIPER_STORE_PASSWORD }}
          VIPER_KEY_PASSWORD: ${{ secrets.VIPER_KEY_PASSWORD }}
          VIPER_KEY_ALIAS: ${{ secrets.VIPER_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: |
          echo "=== Detecting & Restoring Signing Keystore ==="
          ACTIVE_KEYSTORE_FILE=""
          IS_CUSTOM_KEYSTORE=false

          if [ -n "${VIPER_KEYSTORE_BASE64}" ]; then
            echo "Restoring persistent keystore from GitHub Secret VIPER_KEYSTORE_BASE64..."
            python3 -c "
import os, base64, sys
raw = os.environ.get('VIPER_KEYSTORE_BASE64', '')
data = ''.join(raw.split())
if not data:
    sys.exit('VIPER_KEYSTORE_BASE64 is empty')
try:
    decoded = base64.b64decode(data)
    with open('viper-final.jks', 'wb') as f:
        f.write(decoded)
    print(f'Successfully decoded {len(decoded)} bytes into viper-final.jks')
except Exception as e:
    sys.exit(f'Failed to base64-decode VIPER_KEYSTORE_BASE64: {e}')
"
            ACTIVE_KEYSTORE_FILE="./viper-final.jks"
            cp -f "./viper-final.jks" "./debug.keystore"
            IS_CUSTOM_KEYSTORE=true
          elif [ -f "./viper-final.jks" ] && [ -s "./viper-final.jks" ]; then
            echo "Found existing viper-final.jks in repository."
            ACTIVE_KEYSTORE_FILE="./viper-final.jks"
            cp -f "./viper-final.jks" "./debug.keystore"
            IS_CUSTOM_KEYSTORE=true
          elif [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            echo "Restoring persistent keystore from GitHub Secret DEBUG_KEYSTORE_BASE64..."
            python3 -c "
import os, base64, sys
raw = os.environ.get('DEBUG_KEYSTORE_BASE64', '')
data = ''.join(raw.split())
if not data:
    sys.exit('DEBUG_KEYSTORE_BASE64 is empty')
try:
    decoded = base64.b64decode(data)
    with open('debug.keystore', 'wb') as f:
        f.write(decoded)
    print(f'Successfully decoded {len(decoded)} bytes into debug.keystore')
except Exception as e:
    sys.exit(f'Failed to base64-decode DEBUG_KEYSTORE_BASE64: {e}')
"
            ACTIVE_KEYSTORE_FILE="./debug.keystore"
            IS_CUSTOM_KEYSTORE=false
          elif [ -f "./debug.keystore" ] && [ -s "./debug.keystore" ]; then
            echo "Using existing repository debug.keystore."
            ACTIVE_KEYSTORE_FILE="./debug.keystore"
            IS_CUSTOM_KEYSTORE=false
          elif [ -f "./debug.keystore.base64" ] && [ -s "./debug.keystore.base64" ]; then
            echo "Restoring persistent keystore from repository debug.keystore.base64..."
            python3 -c "
import base64
with open('debug.keystore.base64', 'r') as f:
    raw = f.read()
data = ''.join(raw.split())
decoded = base64.b64decode(data)
with open('debug.keystore', 'wb') as out:
    out.write(decoded)
print(f'Restored {len(decoded)} bytes into debug.keystore')
"
            ACTIVE_KEYSTORE_FILE="./debug.keystore"
            IS_CUSTOM_KEYSTORE=false
          else
            echo "::error::No persistent signing keystore found! Looked for VIPER_KEYSTORE_BASE64, viper-final.jks, DEBUG_KEYSTORE_BASE64, debug.keystore, and debug.keystore.base64."
            echo "Refusing to generate a random key that breaks Firebase Google Sign-In and APK update compatibility."
            exit 1
          fi

          if [ ! -f "${ACTIVE_KEYSTORE_FILE}" ] || [ ! -s "${ACTIVE_KEYSTORE_FILE}" ]; then
            echo "::error::Keystore file ${ACTIVE_KEYSTORE_FILE} is missing or empty (0 bytes) after restore."
            exit 1
          fi

          # Password resolution: do NOT assume password is android for a custom keystore
          STORE_PASS="${VIPER_STORE_PASSWORD:-${STORE_PASSWORD:-${DEBUG_STORE_PASSWORD}}}"
          if [ "${IS_CUSTOM_KEYSTORE}" = true ]; then
            if [ -z "${STORE_PASS}" ]; then
              echo "::error::Custom signing keystore (viper-final.jks / VIPER_KEYSTORE_BASE64) detected, but VIPER_STORE_PASSWORD is not set in GitHub Secrets!"
              echo "Do NOT assume the password is 'android' for a custom keystore."
              echo "Please configure VIPER_STORE_PASSWORD in repository Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          else
            if [ -z "${STORE_PASS}" ]; then
              STORE_PASS="android"
            fi
          fi

          echo "=== Validating Keystore Integrity with keytool ==="
          KEYTOOL_OUT=$(mktemp)
          if ! "${JAVA_HOME}/bin/keytool" -list -keystore "${ACTIVE_KEYSTORE_FILE}" -storepass "${STORE_PASS}" > "${KEYTOOL_OUT}" 2>&1; then
            echo "::error::Keystore password verification failed for ${ACTIVE_KEYSTORE_FILE}!"
            echo "keytool error output (passwords hidden):"
            grep -iE "error|exception|tampered|password|format" "${KEYTOOL_OUT}" || cat "${KEYTOOL_OUT}"
            rm -f "${KEYTOOL_OUT}"
            echo ""
            echo "Troubleshooting steps:"
            echo "1. Verify that VIPER_STORE_PASSWORD in GitHub Secrets matches the exact store password of viper-final.jks."
            echo "2. If using VIPER_KEYSTORE_BASE64, make sure the entire base64 string was copied without missing characters or extra spaces."
            echo "3. Generate the base64 string with: base64 -w 0 viper-final.jks (Linux) or base64 -i viper-final.jks (macOS)."
            exit 1
          fi

          # Resolve key alias
          KEY_ALIAS="${VIPER_KEY_ALIAS:-${KEY_ALIAS:-${DEBUG_KEY_ALIAS}}}"
          if [ -z "${KEY_ALIAS}" ]; then
            DETECTED_ALIAS=$(grep -E ", (PrivateKeyEntry|trustedCertEntry)" "${KEYTOOL_OUT}" | head -n 1 | awk -F',' '{print $1}' | xargs)
            if [ -n "${DETECTED_ALIAS}" ]; then
              echo "No VIPER_KEY_ALIAS specified. Automatically detected alias from keystore: '${DETECTED_ALIAS}'"
              KEY_ALIAS="${DETECTED_ALIAS}"
            elif [ "${IS_CUSTOM_KEYSTORE}" = false ]; then
              KEY_ALIAS="androiddebugkey"
            else
              echo "::error::Could not find any key alias in ${ACTIVE_KEYSTORE_FILE}."
              cat "${KEYTOOL_OUT}"
              echo "Please configure VIPER_KEY_ALIAS in GitHub Secrets."
              rm -f "${KEYTOOL_OUT}"
              exit 1
            fi
          fi

          # Validate key alias exists in keystore
          if ! "${JAVA_HOME}/bin/keytool" -list -keystore "${ACTIVE_KEYSTORE_FILE}" -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" > "${KEYTOOL_OUT}" 2>&1; then
            echo "::error::Key alias '${KEY_ALIAS}' not found in ${ACTIVE_KEYSTORE_FILE}!"
            echo "Entries available in this keystore:"
            "${JAVA_HOME}/bin/keytool" -list -keystore "${ACTIVE_KEYSTORE_FILE}" -storepass "${STORE_PASS}" | grep -E ", (PrivateKeyEntry|trustedCertEntry)" || true
            echo "Please set the VIPER_KEY_ALIAS GitHub Secret to the correct alias name shown above."
            rm -f "${KEYTOOL_OUT}"
            exit 1
          fi
          rm -f "${KEYTOOL_OUT}"

          # Resolve key password (defaults to store password if not specified)
          KEY_PASS="${VIPER_KEY_PASSWORD:-${KEY_PASSWORD:-${DEBUG_KEY_PASSWORD:-${STORE_PASS}}}}"

          echo "=== Verified Keystore Certificate Fingerprints ==="
          "${JAVA_HOME}/bin/keytool" -list -v -keystore "${ACTIVE_KEYSTORE_FILE}" -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" | grep -E "Owner:|Issuer:|SHA1:|SHA256:" || true
          echo "Persistent signing keystore verified successfully."

          # Export validated environment variables for subsequent Gradle steps
          ABS_KEYSTORE_PATH="${GITHUB_WORKSPACE}/${ACTIVE_KEYSTORE_FILE#./}"
          echo "KEYSTORE_PATH=${ABS_KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE_PATH=${ABS_KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "VIPER_KEYSTORE_PATH=${ABS_KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "VIPER_STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "VIPER_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
          echo "VIPER_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"

      - name: Build the debug APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          DEBUG_KEYSTORE_PATH: ${{ env.DEBUG_KEYSTORE_PATH }}
          VIPER_KEYSTORE_PATH: ${{ env.VIPER_KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS }}
          VIPER_STORE_PASSWORD: ${{ env.VIPER_STORE_PASSWORD }}
          VIPER_KEY_PASSWORD: ${{ env.VIPER_KEY_PASSWORD }}
          VIPER_KEY_ALIAS: ${{ env.VIPER_KEY_ALIAS }}
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at ${EXPECTED_APK}!"
            echo "Searching exclusively in app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: ${EXPECTED_APK} is empty (0 bytes)."
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension."
              exit 1
              ;;
          esac

          echo "APK successfully verified at ${EXPECTED_APK} ($(du -h "${EXPECTED_APK}" | cut -f1))."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${ASSET_DIR}"

          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "${RAW_REPO_NAME}" ]; then
            RAW_REPO_NAME="viper-studio"
          fi

          # Sanitize repository name to safe filename characters
          SAFE_REPO_NAME=$(echo "${RAW_REPO_NAME}" | tr -cd 'a-zA-Z0-9._-')
          if [ -z "${SAFE_REPO_NAME}" ]; then
            SAFE_REPO_NAME="viper-studio"
          fi

          RUN_NUM="${{ github.run_number }}"
          TARGET_FILENAME="${SAFE_REPO_NAME}-debug-v${RUN_NUM}.apk"
          TARGET_FILEPATH="${ASSET_DIR}/${TARGET_FILENAME}"

          echo "Copying verified APK to temporary release asset path..."
          cp "app/build/outputs/apk/debug/app-debug.apk" "${TARGET_FILEPATH}"

          if [ ! -f "${TARGET_FILEPATH}" ] || [ ! -s "${TARGET_FILEPATH}" ]; then
            echo "ERROR: Failed to prepare release asset at ${TARGET_FILEPATH}."
            exit 1
          fi

          echo "Prepared release asset: ${TARGET_FILEPATH}"
          echo "RELEASE_ASSET_PATH=${TARGET_FILEPATH}" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET_NAME=${TARGET_FILENAME}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "VIPER STUDIO Debug v${{ github.run_number }}"
          body: |
            ### VIPER STUDIO — Android Debug APK Build

            - **Build Number**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`

            #### Direct Download
            Download the attached `.apk` file below directly onto your Android device to install and test VIPER STUDIO.
          files: ${{ env.RELEASE_ASSET_PATH }}
          token: ${{ github.token }}
          draft: false
          prerelease: false
